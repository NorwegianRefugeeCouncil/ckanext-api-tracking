{% extends "dashboard/base.html" %}

{% block primary_content %}
  <article class="module">
    
    <section id="stats-total-datasets" class="module-content tab-content active">
      <h2>{{ _('Total Number of Datasets') }}</h2>

      <div class="tracking-chart" data-module="api-tracking-chart" data-module-chart="{{ h.dump_json(chart) }}">
        <canvas role="img" aria-label="{{ _('Total number of datasets by week') }}"></canvas>
      </div>

      <table class="table table-chunky table-bordered table-striped">
        <thead>
          <tr>
            <th>{{ _("Date") }}</th>
            <th>{{ _("Total datasets") }}</th>
          </tr>
        </thead>
        <tbody>
          {% for row in weeks %}
            <tr>
              <th><time datetime="{{ row.week.isoformat() }}">{{ h.render_datetime(row.week) }}</time></th>
              <td>{{ row.total }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </section>

  </article>
{% endblock %}
